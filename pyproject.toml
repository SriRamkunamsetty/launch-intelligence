[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-intelligence"
version = "1.0.0"
description = "Entertainment launch analytics: velocity, share of voice, benchmarks, anomaly episodes linked to campaign events, executive deck"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
deck = ["python-pptx>=0.6.23"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.28.0", "pydantic>=2.5.0"]
ml = ["numpy>=1.24.0", "scipy>=1.10.0", "scikit-learn>=1.3.0"]
redis = ["redis>=5.0.0"]
all = [
    "psycopg[binary]>=3.1",
    "python-pptx>=0.6.23",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "redis>=5.0.0",
]

[project.scripts]
launch-intel = "launch_intel.cli:main"

[tool.setuptools.package-data]
launch_intel = ["schema.sql"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E722", "E741", "E702", "E701", "E402", "E731"]

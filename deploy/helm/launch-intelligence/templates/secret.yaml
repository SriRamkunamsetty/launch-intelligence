apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launch-intelligence.fullname" . }}-secret
  labels:
    {{- include "launch-intelligence.labels" . | nindent 4 }}
type: Opaque
stringData:
  YOUTUBE_API_KEY: {{ .Values.secrets.YOUTUBE_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | quote }}

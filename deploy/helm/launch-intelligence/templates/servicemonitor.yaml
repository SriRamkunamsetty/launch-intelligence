{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "launch-intelligence.fullname" . }}
  labels:
    {{- include "launch-intelligence.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "launch-intelligence.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}

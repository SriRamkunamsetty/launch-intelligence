apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "launch-intelligence.fullname" . }}-config
  labels:
    {{- include "launch-intelligence.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  LAUNCH_INTEL_DEMO: {{ .Values.env.LAUNCH_INTEL_DEMO | quote }}

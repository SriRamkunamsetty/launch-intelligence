name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Quality & Security Static Analysis
  # ============================================================================
  lint-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff Lint Check
        run: ruff check src/ tests/

      - name: Bandit Security Static Analysis
        run: bandit -r src/ -ll -ii

  # ============================================================================
  # 2. Automated Test Suite Matrix with Live PostgreSQL & Redis
  # ============================================================================
  test:
    name: Test Suite (Python ${{ matrix.python }})
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: launch_intel_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: "pip"

      - name: Install Package & All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Full Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/launch_intel_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --cov=src/launch_intel --cov-report=xml --cov-report=term

  # ============================================================================
  # 3. Helm Chart Validation
  # ============================================================================
  helm-validation:
    name: Helm Chart & Kubernetes Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint deploy/helm/launch-intelligence

      - name: Helm Template Dry-Run Test
        run: helm template test-release deploy/helm/launch-intelligence

  # ============================================================================
  # 4. Container Build & Push to GHCR (on push to main or tags)
  # ============================================================================
  build-and-publish:
    name: Build & Push Production Container Image
    needs: [test, helm-validation]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

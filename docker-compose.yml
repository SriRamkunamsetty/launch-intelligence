services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launch-intel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://launch_user:launch_pass@postgres:5432/launch_intel
      - REDIS_URL=redis://redis:6379/0
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - launch-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launch-intel-worker
    restart: unless-stopped
    command: ["schedule", "--config", "/app/examples/titles.example.json", "--every-hours", "6"]
    environment:
      - DATABASE_URL=postgresql://launch_user:launch_pass@postgres:5432/launch_intel
      - REDIS_URL=redis://redis:6379/0
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - launch-net

  postgres:
    image: postgres:16-alpine
    container_name: launch-intel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=launch_intel
      - POSTGRES_USER=launch_user
      - POSTGRES_PASSWORD=launch_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch_user -d launch_intel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - launch-net

  redis:
    image: redis:7-alpine
    container_name: launch-intel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - launch-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: launch-intel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - launch-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: launch-intel-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - launch-net

networks:
  launch-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
